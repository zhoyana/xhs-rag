<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小红书知识库 · 工作台</title>
  <link rel="stylesheet" href="/ui/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">小红书知识库 · 工作台</div>
    <nav class="tabs" id="tabs">
      <button class="tab" data-view="inbox">收件箱<span class="tab-badge" id="inbox-badge" hidden></span></button>
      <button class="tab" data-view="notes">笔记库</button>
      <button class="tab" data-view="folders">收藏夹</button>
      <button class="tab" data-view="chat">对话</button>
      <button class="tab" data-view="calendar">日历</button>
    </nav>
    <div class="health" id="health" title="后端状态">…</div>
  </header>

  <main class="content">
    <!-- 收件箱：导入之后的整理队列。AI 先读、先猜意图、先挑收藏夹，你只需要确认 -->
    <section class="view" id="view-inbox">
      <div class="toolbar">
        <button id="btn-prepare-all" class="primary">让 AI 整理剩余</button>
        <button id="btn-stop-prepare" class="ghost" hidden>停止分析</button>
        <span id="inbox-progress" class="hint"></span>
        <button id="btn-refresh-inbox" class="ghost">刷新</button>
      </div>
      <div class="inbox-list" id="inbox-list"></div>
    </section>

    <!-- 笔记库 -->
    <section class="view" id="view-notes">
      <div class="toolbar">
        <textarea id="import-box" placeholder="粘贴小红书分享链接，每行一个，批量导入到收件箱…"></textarea>
        <div class="toolbar-actions">
          <button id="btn-import" class="primary">批量导入</button>
          <button id="btn-read-all" class="ghost" title="为所有已下载图片的笔记补读图（会消耗视觉模型额度）">全部补读图</button>
          <button id="btn-refresh-notes" class="ghost">刷新</button>
        </div>
        <div id="import-result" class="hint"></div>
      </div>
      <!-- 批量删除：一篇一篇点太累。勾选后在这里一次处理；常驻显示是为了让「全选」
           一直够得着——按钮只在有选中时才出现的话，用户就没法从零开始全选。 -->
      <div class="bulk-bar" id="notes-bulk">
        <label class="bulk-all"><input type="checkbox" id="notes-pick-all" /><span>全选</span></label>
        <span class="bulk-count" id="notes-bulk-count">已选 0 篇</span>
        <button id="btn-notes-delete" class="ghost danger" disabled
          title="彻底删除：连带图片、AI 分析、收藏意图、收藏夹归属与检索索引，不可恢复">删除选中</button>
        <span class="bulk-hint">删除不可恢复；笔记派生出来的待办也会一起删掉</span>
      </div>
      <div class="split">
        <ul class="note-list" id="note-list"></ul>
        <div class="note-detail" id="note-detail">
          <p class="muted">从左侧选择一篇笔记查看详情。</p>
        </div>
      </div>
    </section>

    <!-- 收藏夹 -->
    <section class="view" id="view-folders">
      <div class="toolbar">
        <input id="folder-name" placeholder="新收藏夹名称" />
        <input id="folder-desc" placeholder="一句话用途（可选）" />
        <button id="btn-new-folder" class="primary">新建收藏夹</button>
        <button id="btn-refresh-folders" class="ghost">刷新</button>
      </div>
      <div class="split">
        <ul class="note-list" id="folder-list"></ul>
        <div class="note-detail" id="folder-notes">
          <p class="muted">选择收藏夹查看其中笔记。</p>
        </div>
      </div>
    </section>

    <!-- 对话（Codex 风格：左侧会话历史 + 右侧消息流 + 底部输入区）
         原来的「检索」视图已并入这里：回答下方可展开「原始命中」看这一轮到底
         检索到了哪些原文片段，不用再在"检索/对话"两个入口之间做选择。 -->
    <section class="view" id="view-chat">
      <div class="chat-shell">
        <aside class="chat-side">
          <div class="chat-side-head">
            <button id="btn-new-thread" class="primary block">＋ 新建对话</button>
            <input id="thread-filter" placeholder="搜索会话标题…" />
          </div>
          <div class="chat-thread-list" id="thread-list"></div>
          <div class="chat-side-foot">
            <span id="thread-count" class="muted"></span>
            <button id="btn-toggle-theme" class="ghost">切换主题</button>
          </div>
        </aside>

        <div class="chat-main">
          <header class="chat-head">
            <div class="chat-title-wrap">
              <input id="thread-title" class="chat-title" placeholder="未命名对话" />
              <span id="thread-meta" class="muted"></span>
            </div>
            <div class="chat-head-actions">
              <button id="btn-consolidate" class="ghost" title="把这段对话里暴露的长期偏好提炼成记忆候选，供你审核">提炼记忆</button>
              <button id="btn-delete-thread" class="ghost danger">删除对话</button>
            </div>
          </header>

          <div class="chat-scroll" id="chat-scroll">
            <div class="chat-stream" id="chat-stream"></div>
          </div>

          <button id="btn-jump-bottom" class="jump-bottom">↓ 回到最新</button>

          <div class="composer">
            <div class="composer-box">
              <textarea id="chat-text" rows="1"
                placeholder="问点什么…例如：我收藏的面经里笔试都考什么？（Enter 发送，Shift+Enter 换行）"></textarea>
              <button id="btn-send" class="send" title="发送（Enter）">↑</button>
            </div>
            <div class="composer-hint">
              <span>Enter 发送 · Shift+Enter 换行 · 回答只依据你收藏的笔记，并标注出处</span>
              <span id="composer-status" class="muted"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 日历：计划只有在你于对话里点过「确认计划」之后才会落到这里。
         未确认的草案以虚影标出，提醒你"这里还欠一个决定"，而不是直接当成任务。 -->
    <section class="view" id="view-calendar">
      <div class="cal-bar">
        <div class="cal-nav">
          <button id="btn-cal-prev" class="ghost" title="上个月">‹</button>
          <button id="btn-cal-today" class="ghost">今天</button>
          <button id="btn-cal-next" class="ghost" title="下个月">›</button>
          <span class="cal-label" id="cal-label"></span>
        </div>
        <div class="seg-group" id="cal-views">
          <button class="seg active" data-calview="month">月历</button>
          <button class="seg" data-calview="list">清单</button>
        </div>
        <span class="hint" id="cal-summary"></span>
        <button id="btn-refresh-cal" class="ghost">刷新</button>
      </div>

      <div class="cal-body" id="cal-month-body">
        <div class="cal-grid-wrap">
          <div class="cal-weekdays">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
        <aside class="cal-day" id="cal-day">
          <div class="cal-day-head">
            <b id="cal-day-title">选一天</b>
            <span class="muted" id="cal-day-meta"></span>
          </div>
          <div class="cal-day-list" id="cal-day-list"></div>
          <div class="cal-day-foot">
            <button id="btn-cal-ask" class="ghost"
              title="切到对话，让 agent 参考你收藏的笔记来安排这一天">让 agent 帮我安排</button>
          </div>
        </aside>
      </div>

      <div class="cal-list" id="cal-list-body" hidden>
        <div class="bulk-bar" id="tasks-bulk">
          <label class="bulk-all"><input type="checkbox" id="tasks-pick-all" /><span>全选</span></label>
          <span class="bulk-count" id="tasks-bulk-count">已选 0 条</span>
          <button id="btn-tasks-delete" class="ghost danger" disabled
            title="从数据库彻底移除，不可恢复">删除选中</button>
          <span class="bulk-hint">批量只提供「删除」：一次圈十几条时，你要的是它们别再碍眼</span>
        </div>
        <div class="toolbar">
          <select id="task-filter">
            <option value="">全部</option>
            <option value="pending">待办</option>
            <option value="completed">已完成</option>
            <option value="cancelled">已取消</option>
          </select>
          <span class="hint">取消＝不打算做了（留痕可追溯）；删除＝从数据库彻底移除，不可恢复</span>
        </div>
        <ul class="result-list" id="task-list"></ul>
      </div>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="/ui/app.js"></script>
</body>
</html>
